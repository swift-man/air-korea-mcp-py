[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "air-korea-mcp"
version = "0.1.0"
description = "MCP and FastAPI REST interfaces for the Air Korea public OpenAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111,<1",
  "mcp[cli]>=1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
air-korea-mcp = "air_korea_mcp.server:main"
air-korea-rest-api = "air_korea_mcp.rest_api:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
